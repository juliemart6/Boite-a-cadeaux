    <title>Boîte à Cadeaux 🎁</title>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBg: '#F3F4F6',
                        brandPrimary: '#6366F1', /* Indigo élégant */
                        brandAccent: '#EC4899', /* Rose vibrant */
                        brandDark: '#1F2937',
                        brandCard: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

    </header>

            <button onclick="setRecipient('Tous')" class="filter-btn active shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-brandPrimary text-white shadow-md">Tout le monde</button>
            <button onclick="setRecipient('Moi')" class="filter-btn shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-white text-gray-600 border border-gray-200">🙋‍♀️ Moi (23 ans)</button>
            <button onclick="setRecipient('Copain')" class="filter-btn shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-white text-gray-600 border border-gray-200">❤️ Copain (25 ans)</button>
            <button onclick="setRecipient('Famille')" class="filter-btn shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-white text-gray-600 border border-gray-200">👨‍👩‍👧 Famille</button>
            <button onclick="setRecipient('Amis')" class="filter-btn shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-white text-gray-600 border border-gray-200">🍻 Amis</button>
        </div>

        <!-- Sous-filtres Famille (Cachés par défaut) -->
        <div id="family-subfilters" class="hidden gap-2 overflow-x-auto pb-4 mb-2 hide-scroll">
            <button onclick="setSubFilter('Tous')" class="subfilter-btn active shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-brandDark text-white">Tous</button>
            <button onclick="setSubFilter('Parents')" class="subfilter-btn shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-gray-200 text-gray-700">Parents</button>
            <button onclick="setSubFilter('Fratrie')" class="subfilter-btn shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-gray-200 text-gray-700">Fratrie</button>
            <button onclick="setSubFilter('Grands-parents')" class="subfilter-btn shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-gray-200 text-gray-700">Grands-parents</button>
            <button onclick="setSubFilter('Oncles/Tantes')" class="subfilter-btn shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-gray-200 text-gray-700">Oncles & Tantes</button>

        </div>

            <button onclick="setStatus('Tous')" id="status-Tous" class="status-btn flex-1 py-2.5 rounded-xl text-sm font-bold bg-white shadow-sm text-brandPrimary transition-all">Tout</button>
            <button onclick="setStatus('Idée')" id="status-Idée" class="status-btn flex-1 py-2.5 rounded-xl text-sm font-medium text-gray-500 transition-all">💡 À trouver</button>

        <div id="gifts-container" class="space-y-4">

        </div>

        <!-- Bouton flottant Ajouter -->
        <button onclick="openAddModal()" class="fixed bottom-6 right-6 bg-brandAccent text-white h-14 w-14 flex items-center justify-center rounded-full shadow-[0_4px_20px_rgba(236,72,153,0.5)] hover:scale-110 transition-transform z-50 text-2xl border-2 border-white">
            ➕
        </button>

                    <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
                </div>
                <form id="add-form" onsubmit="submitNewGift(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Cadeau</label>
                        <input type="text" id="f-titre" required placeholder="Ex: Baskets New Balance..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Pour qui ?</label>
                            <select id="f-dest" onchange="toggleProcheField()" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                                <option value="Moi">🙋‍♀️ Moi</option>
                                <option value="Copain">❤️ Copain</option>
                                <option value="Famille">👨‍👩‍👧 Famille</option>
                                <option value="Amis">🍻 Amis</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Prix approx.</label>
                            <input type="text" id="f-prix" placeholder="Ex: 50€" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                        </div>
                    </div>
                    
                    <div id="proche-container" class="hidden">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Membre de la famille</label>
                        <select id="f-proche" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                            <option value="Parents">Parents</option>
                            <option value="Fratrie">Fratrie</option>
                            <option value="Grands-parents">Grands-parents</option>
                            <option value="Oncles/Tantes">Oncles & Tantes</option>
                            <option value="Enfants/Ados">Enfants & Ados</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Occasion</label>
                            <input type="text" id="f-occasion" placeholder="Ex: Noël, Anniversaire..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Statut</label>
                            <select id="f-statut" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                                <option value="Idée">💡 Idée</option>
                                <option value="Acheté">✅ Acheté</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Lien Web (Optionnel)</label>
                        <input type="url" id="f-lien" placeholder="https://..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Note (Optionnel)</label>
                        <input type="text" id="f-note" placeholder="Taille, couleur, préférence..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brandPrimary">
                    </div>
                    <button type="submit" class="w-full bg-brandAccent text-white font-bold py-3 rounded-xl mt-2 shadow-md hover:bg-pink-600 transition">Enregistrer le cadeau</button>
                </form>
            </div>
        </dialog>

            { id: 60, destinataire: "Famille", proche: "Enfants/Ados", titre: "Gros set LEGO (Harry Potter / Star Wars)", prix: "50-100€", lien: "https://www.lego.com", statut: "Idée", occasion: "Anniversaire (8+)", note: "Toujours un succès" },
            { id: 61, destinataire: "Famille", proche: "Enfants/Ados", titre: "Déco Néon Led (Forme manette ou texte)", prix: "30€", lien: "https://www.amazon.fr", statut: "Idée", occasion: "Noël (Ado)", note: "Pour la chambre" },
            { id: 62, destinataire: "Famille", proche: "Enfants/Ados", titre: "AirPods (Apple)", prix: "140€", lien: "https://www.apple.com", statut: "Idée", occasion: "Gros cadeau Ado", note: "Le graal des lycéens" },
            { id: 63, destinataire: "Famille", proche: "Enfants/Ados", titre: "Gourde AirUp", prix: "40€", lien: "https://fr.air-up.com", statut: "Idée", occasion: "Anniversaire", note: "La gourde qui donne du goût à l'eau, ultra tendance" },
            { id: 64, destinataire: "Famille", proche: "Enfants/Ados", titre: "Collection Manga (One Piece / Demon Slayer)", prix: "7€ l'unité", lien: "https://www.fnac.com", statut: "Idée", occasion: "Noël", note: "Acheter les tomes qui leur manquent" },
            { id: 65, destinataire: "Famille", proche: "Enfants/Ados", titre: "Appareil photo enfant KidiZoom", prix: "50€", lien: "", statut: "Idée", occasion: "Anniv (4-8 ans)", note: "Résistant aux chocs" },
            { id: 66, destinataire: "Famille", proche: "Enfants/Ados", titre: "Carte Cadeau (Cultura / PSN / V-Bucks)", prix: "20-50€", lien: "", statut: "Idée", occasion: "Dépannage Ado", note: "Quand on n'a vraiment aucune idée" }
        ];

        let cadeaux = [];
        let currentRecipient = 'Tous';
        let currentSubFilter = 'Tous';
        let currentStatus = 'Tous';

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { 
                    cadeaux = JSON.parse(saved);
                    // Si le cache est vide on remet la base
                    if(cadeaux.length === 0) cadeaux = [...baseCadeaux];
                } catch(e) { cadeaux = [...baseCadeaux]; }
            } else {
                cadeaux = [...baseCadeaux];
            }
            renderGifts();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cadeaux));
        }

        function renderGifts() {
            const container = document.getElementById('gifts-container');
            container.innerHTML = '';

            // Filtrage multiple
            const filtered = cadeaux.filter(cadeau => {
                const matchRecipient = currentRecipient === 'Tous' || cadeau.destinataire === currentRecipient;
                // Si la famille est sélectionnée et qu'un sous-filtre est actif
                const matchSub = currentRecipient !== 'Famille' || currentSubFilter === 'Tous' || cadeau.proche === currentSubFilter;
                const matchStatus = currentStatus === 'Tous' || cadeau.statut === currentStatus;
                
                return matchRecipient && matchSub && matchStatus;
            });

            document.getElementById('gift-counter').innerText = filtered.length + " idées";

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-gray-100 shadow-sm p-6">
                        <div class="text-4xl mb-3">🤔</div>
                        <h3 class="text-base font-bold text-gray-700">Aucune idée ici !</h3>
                        <p class="text-xs text-gray-400 mt-1">Ajoutez-en une via le bouton + en bas.</p>
                    </div>`;
                return;
            }

            filtered.forEach(cadeau => {
                let badgeClass = cadeau.statut === 'Acheté' 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200 shadow-sm' 
                    : 'bg-orange-50 text-orange-700 border-orange-200 shadow-sm';
                
                let iconStatut = cadeau.statut === 'Acheté' ? '✅' : '💡';
                
                // Formater l'étiquette destinataire
                let destLabel = cadeau.destinataire;
                if (cadeau.destinataire === 'Famille' && cadeau.proche) destLabel += ` • ${cadeau.proche}`;
                if (cadeau.occasion) destLabel += ` • ${cadeau.occasion}`;

                const card = document.createElement('div');
                card.className = "bg-brandCard rounded-3xl p-5 shadow-[0_2px_15px_-10px_rgba(0,0,0,0.1)] border border-gray-100 relative transition-all duration-300";
                
                card.innerHTML = `
                    <button onclick="deleteGift(${cadeau.id})" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition text-lg" title="Supprimer">🗑️</button>
                    
                    <div class="pr-6">
                        <span class="text-[10px] font-black uppercase tracking-wider text-brandPrimary bg-indigo-50 px-2 py-1 rounded-md mb-2 inline-block">
                            ${destLabel}
                        </span>
                        <div class="flex justify-between items-start gap-2 mb-1">
                            <h3 class="text-lg font-black leading-tight text-gray-800">${cadeau.titre}</h3>
                        </div>
                        ${cadeau.prix ? `<span class="text-sm font-bold text-brandAccent">${cadeau.prix}</span>` : ''}
                    </div>
                    
                    ${cadeau.note ? `<div class="bg-gray-50 p-3 rounded-xl border border-gray-100 mt-3"><p class="text-sm text-gray-600 font-medium italic">💬 ${cadeau.note}</p></div>` : ''}
                    
                    <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-100">
                        <button onclick="toggleGiftStatus(${cadeau.id})" class="text-xs font-bold px-3 py-2 rounded-lg border transition-all cursor-pointer hover:scale-105 active:scale-95 ${badgeClass}">
                            ${iconStatut} ${cadeau.statut}
                        </button>
                        
                        ${cadeau.lien ? `<a href="${cadeau.lien}" target="_blank" class="text-sm bg-brandDark text-white shadow-md hover:bg-black px-4 py-2 rounded-xl font-bold transition flex items-center gap-2">Voir <span>↗</span></a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setRecipient(rec) {
            currentRecipient = rec;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(rec) || (rec === 'Tous' && btn.innerText.includes('Tout'))) {
                    btn.className = "filter-btn active shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-brandPrimary text-white shadow-md";
                } else {
                    btn.className = "filter-btn shrink-0 px-5 py-2.5 rounded-full font-bold text-sm transition-all bg-white text-gray-600 border border-gray-200";
                }
            });

            // Afficher/Cacher les sous-filtres Famille
            const subFilterContainer = document.getElementById('family-subfilters');
            if(rec === 'Famille') {
                subFilterContainer.classList.remove('hidden');
                subFilterContainer.classList.add('flex');
            } else {
                subFilterContainer.classList.add('hidden');
                subFilterContainer.classList.remove('flex');
                currentSubFilter = 'Tous'; // Reset subfilter
                updateSubFilterButtons();
            }
            renderGifts();
        }

        function setSubFilter(sub) {
            currentSubFilter = sub;
            updateSubFilterButtons();
            renderGifts();
        }

        function updateSubFilterButtons() {
            document.querySelectorAll('.subfilter-btn').forEach(btn => {
                if(btn.innerText === currentSubFilter || (currentSubFilter === 'Tous' && btn.innerText === 'Tous')) {
                    btn.className = "subfilter-btn active shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-brandDark text-white";
                } else {
                    btn.className = "subfilter-btn shrink-0 px-4 py-1.5 rounded-full font-medium text-xs transition-all bg-gray-200 text-gray-700";
                }
            });
        }

        function setStatus(stat) {
            currentStatus = stat;
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.className = "status-btn flex-1 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:bg-white/50 transition-all";
            });
            const activeBtn = document.getElementById(`status-${stat}`);
            activeBtn.className = "status-btn flex-1 py-2.5 rounded-xl text-sm font-bold bg-white shadow-sm text-brandPrimary transition-all";
            renderGifts();
        }

        window.toggleGiftStatus = function(id) {
            const index = cadeaux.findIndex(c => c.id === id);
            if (index > -1) {
                cadeaux[index].statut = cadeaux[index].statut === 'Idée' ? 'Acheté' : 'Idée';
                saveData();
                renderGifts();
            }
        };

        window.deleteGift = function(id) {
            if(confirm("Supprimer cette idée de cadeau ?")) {
                cadeaux = cadeaux.filter(c => c.id !== id);
                saveData();
                renderGifts();
            }
        };

        // Modale d'ajout
        window.openAddModal = () => document.getElementById('add-modal').showModal();
        window.closeAddModal = () => {
            document.getElementById('add-modal').close();
            document.getElementById('add-form').reset();
            document.getElementById('proche-container').classList.add('hidden');
        };

        window.toggleProcheField = () => {
            const dest = document.getElementById('f-dest').value;
            const procheContainer = document.getElementById('proche-container');
            if(dest === 'Famille') {
                procheContainer.classList.remove('hidden');
            } else {
                procheContainer.classList.add('hidden');
            }
        };

        window.submitNewGift = function(e) {
            e.preventDefault();
            const dest = document.getElementById('f-dest').value;
            
            const newGift = {
                id: Date.now(), // ID unique facile
                destinataire: dest,
                proche: dest === 'Famille' ? document.getElementById('f-proche').value : null,
                titre: document.getElementById('f-titre').value,
                prix: document.getElementById('f-prix').value,
                occasion: document.getElementById('f-occasion').value,
                statut: document.getElementById('f-statut').value,
                lien: document.getElementById('f-lien').value,
                note: document.getElementById('f-note').value
            };

            cadeaux.unshift(newGift); // Ajout au début
            saveData();
            renderGifts();
            closeAddModal();
            
            // On bascule automatiquement sur le bon filtre pour voir l'ajout
            setRecipient(dest);
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>

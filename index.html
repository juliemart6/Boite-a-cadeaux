<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boîte à Cadeaux 🎁</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

                        brandBg: '#F0F9FF', /* Un bleu très très clair (Sky 50) */
                        brandPrimary: '#0EA5E9', /* Bleu clair/vibrant (Sky 500) */
                        brandPrimaryDark: '#0284C7', /* Bleu un peu plus profond au survol */
                        brandAccent: '#F97316', /* Orange vif (Orange 500) */
                        brandAccentDark: '#EA580C', /* Orange foncé au survol */

                }
            }
        }

    <style>

<body class="font-sans pb-24 selection:bg-brandAccent selection:text-white overflow-hidden" id="body-container">

    <!-- ÉCRAN DE CONNEXION -->

        <div class="bg-white p-10 rounded-2xl shadow-xl max-w-sm w-full text-center border border-sky-100">
            <h2 class="text-2xl font-bold text-brandPrimary mb-2 tracking-tight">Boîte à Cadeaux</h2>
            <p class="text-sm text-slate-500 mb-8">Veuillez vous identifier pour accéder au carnet partagé.</p>
            
            <input type="email" id="email-input" placeholder="Adresse e-mail" class="w-full text-center text-sm font-medium bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3.5 outline-none focus:border-brandPrimary mb-3 transition-colors text-brandDark">
            
            <input type="password" id="pwd-input" placeholder="Mot de passe" class="w-full text-center text-sm font-medium bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3.5 outline-none focus:border-brandPrimary mb-6 transition-colors text-brandDark">
            
            <button onclick="handleLogin()" id="btn-login" class="w-full bg-brandAccent hover:bg-brandAccentDark text-white font-medium py-3.5 rounded-lg transition shadow-md flex justify-center items-center text-sm">
                Ouvrir le registre
            </button>
            <p id="login-error" class="text-red-500 text-sm font-medium mt-4 opacity-0 transition-opacity">Identifiants incorrects.</p>
        </div>
    </div>

    <!-- EN-TÊTE -->
    <header class="bg-white/80 backdrop-blur-lg border-b border-sky-100 sticky top-0 z-20 py-4 px-6 mb-8 shadow-sm">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-brandPrimary">Boîte à Cadeaux</h1>
                <p class="text-xs text-brandAccent font-medium uppercase tracking-widest mt-0.5">Carnet partagé</p>
            </div>
            <div class="flex items-center gap-4">
                <div id="gift-counter" class="text-xs font-semibold text-brandPrimary bg-sky-50 px-3 py-1.5 rounded-md border border-sky-100">
                    0 idées
                </div>
                <!-- Bouton Déconnexion -->
                <button onclick="handleLogout()" class="w-8 h-8 rounded-full bg-sky-50 hover:bg-sky-100 transition-colors flex items-center justify-center border border-sky-200" title="Se déconnecter">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        
        <!-- Filtres principaux -->
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Filtrer les destinataires</h2>
        </div>
        
        <div class="flex gap-2 overflow-x-auto pb-2 mb-2 hide-scroll" id="recipient-filters">
            <button onclick="setRecipient('Tous')" class="filter-btn active shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-brandPrimary text-white shadow-sm">Tout le monde</button>
            <button onclick="setRecipient('Moi')" class="filter-btn shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-600 border border-sky-100 hover:bg-sky-50 hover:text-brandPrimary">Moi</button>
            <button onclick="setRecipient('Copain')" class="filter-btn shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-600 border border-sky-100 hover:bg-sky-50 hover:text-brandPrimary">Copain</button>
            <button onclick="setRecipient('Famille')" class="filter-btn shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-600 border border-sky-100 hover:bg-sky-50 hover:text-brandPrimary">Famille</button>
            <button onclick="setRecipient('Amis')" class="filter-btn shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-600 border border-sky-100 hover:bg-sky-50 hover:text-brandPrimary">Amis</button>
        </div>

        <!-- Sous-filtres Famille -->
        <div id="family-subfilters" class="hidden gap-2 overflow-x-auto pb-4 mb-2 hide-scroll border-t border-sky-100 pt-3">
            <button onclick="setSubFilter('Tous')" class="subfilter-btn active shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-brandPrimaryDark text-white">Tous</button>
            <button onclick="setSubFilter('Parents')" class="subfilter-btn shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-white border border-sky-100 text-slate-600">Parents</button>
            <button onclick="setSubFilter('Fratrie')" class="subfilter-btn shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-white border border-sky-100 text-slate-600">Fratrie</button>
            <button onclick="setSubFilter('Grands-parents')" class="subfilter-btn shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-white border border-sky-100 text-slate-600">Grands-parents</button>
            <button onclick="setSubFilter('Oncles/Tantes')" class="subfilter-btn shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-white border border-sky-100 text-slate-600">Oncles/Tantes</button>
            <button onclick="setSubFilter('Enfants/Ados')" class="subfilter-btn shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-white border border-sky-100 text-slate-600">Enfants</button>
        </div>

        <!-- Filtre de statut (Onglets) -->
        <div class="flex gap-6 mb-8 mt-6 border-b border-sky-200">
            <button onclick="setStatus('Tous')" id="status-Tous" class="status-btn pb-3 text-sm font-semibold border-b-2 border-brandAccent text-brandAccent transition-all">Toutes les idées</button>

        </div>

        <div id="gifts-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        </div>

            +

                </div>
                <form id="add-form" onsubmit="submitNewGift(event)" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Nom du cadeau</label>
                        <input type="text" id="f-titre" required placeholder="Ex: Montre classique..." class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                    </div>
                    <div class="grid grid-cols-2 gap-4">

                                <option value="Moi">Moi</option>
                                <option value="Copain">Copain</option>
                                <option value="Famille">Famille</option>
                                <option value="Amis">Amis</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Budget estimé</label>
                            <input type="text" id="f-prix" placeholder="Ex: 50€" class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                        </div>
                    </div>
                    
                    <div id="proche-container" class="hidden">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Lien de parenté</label>
                        <select id="f-proche" class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                            <option value="Parents">Parents</option>
                            <option value="Fratrie">Fratrie</option>
                            <option value="Grands-parents">Grands-parents</option>
                            <option value="Oncles/Tantes">Oncles & Tantes</option>
                            <option value="Enfants/Ados">Enfants & Ados</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Occasion</label>
                            <input type="text" id="f-occasion" placeholder="Noël, Anniv..." class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Statut</label>
                            <select id="f-statut" class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                                <option value="Idée">À trouver</option>
                                <option value="Acheté">Déjà acheté</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Lien Web (Optionnel)</label>
                        <input type="url" id="f-lien" placeholder="https://..." class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Détails (Optionnel)</label>
                        <input type="text" id="f-note" placeholder="Taille, couleur..." class="w-full bg-sky-50/50 border border-sky-100 rounded-lg px-4 py-3 text-sm outline-none focus:border-brandPrimary transition-colors text-brandDark">
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" id="btn-submit" class="w-full bg-brandAccent text-white font-medium py-3.5 rounded-lg shadow-md hover:bg-brandAccentDark transition-colors text-sm">
                            Enregistrer l'idée
                        </button>
                    </div>
                </form>
            </div>
        </dialog>
    </main>

            { destinataire: "Famille", proche: "Grands-parents", titre: "Livre 'Raconte-moi ton histoire'", prix: "25€", lien: "https://www.amazon.fr", statut: "Idée", occasion: "Anniversaire", note: "Livre à remplir sur leur vie" },
            { destinataire: "Famille", proche: "Grands-parents", titre: "Coffret de thés", prix: "45€", lien: "https://www.mariagefreres.com", statut: "Idée", occasion: "Fête", note: "" },
            { destinataire: "Famille", proche: "Grands-parents", titre: "Panier garni terroir", prix: "50€", lien: "", statut: "Idée", occasion: "Noël", note: "Foie gras, confitures, vin" },
            { destinataire: "Famille", proche: "Oncles/Tantes", titre: "Coffret d'épices du monde", prix: "35€", lien: "https://www.terreexotique.fr", statut: "Idée", occasion: "Noël", note: "Pour ceux qui aiment cuisiner" },
            { destinataire: "Famille", proche: "Oncles/Tantes", titre: "Terrarium", prix: "45€", lien: "", statut: "Idée", occasion: "Anniversaire", note: "Très déco et zéro entretien" },
            { destinataire: "Famille", proche: "Oncles/Tantes", titre: "Bouteille spiritueux", prix: "60€", lien: "", statut: "Idée", occasion: "Noël", note: "Rhum ou Whisky" },
            { destinataire: "Famille", proche: "Oncles/Tantes", titre: "Huile d'olive grand cru", prix: "30€", lien: "", statut: "Idée", occasion: "Noël", note: "Bouteille design" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "La Fabrique à Histoires (Lunii)", prix: "65€", lien: "https://lunii.com", statut: "Idée", occasion: "Noël (3-7 ans)", note: "Le meilleur cadeau sans écran" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "Gros set LEGO", prix: "50-100€", lien: "https://www.lego.com", statut: "Idée", occasion: "Anniversaire", note: "Toujours un succès" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "Déco Néon Led", prix: "30€", lien: "https://www.amazon.fr", statut: "Idée", occasion: "Noël (Ado)", note: "Pour la chambre" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "AirPods", prix: "140€", lien: "https://www.apple.com", statut: "Idée", occasion: "Gros cadeau Ado", note: "Le graal des lycéens" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "Gourde AirUp", prix: "40€", lien: "https://fr.air-up.com", statut: "Idée", occasion: "Anniversaire", note: "La gourde tendance" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "Collection Manga", prix: "7€ l'unité", lien: "https://www.fnac.com", statut: "Idée", occasion: "Noël", note: "One Piece / Demon Slayer" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "Appareil photo KidiZoom", prix: "50€", lien: "", statut: "Idée", occasion: "Anniv", note: "Résistant aux chocs" },
            { destinataire: "Famille", proche: "Enfants/Ados", titre: "Carte Cadeau (PSN / V-Bucks)", prix: "20-50€", lien: "", statut: "Idée", occasion: "Dépannage Ado", note: "Valeur sûre" }
        ];

        // ================= AUTHENTIFICATION =================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('body-container').classList.remove('overflow-hidden');
                }, 500);
                
                document.getElementById('btn-add').classList.remove('hidden');
                loadDataCloud();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('login-screen').style.opacity = '1';
                document.getElementById('body-container').classList.add('overflow-hidden');
                document.getElementById('btn-add').classList.add('hidden');
                if(unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('email-input').value.trim();
            const pwd = document.getElementById('pwd-input').value.trim();
            const btn = document.getElementById('btn-login');
            const errorText = document.getElementById('login-error');
            
            if(!email || !pwd) return;

            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            errorText.style.opacity = '0';

            try {
                await signInWithEmailAndPassword(auth, email, pwd);
            } catch (error) {
                errorText.style.opacity = '1';
                btn.innerHTML = `Ouvrir le registre`;
            }
        };

        window.handleLogout = () => signOut(auth);

        // ================= GESTION CLOUD =================
        function loadDataCloud() {
            unsubscribeSnapshot = onSnapshot(collection(db, COLLECTION_PATH), async (snapshot) => {
                if (snapshot.empty && !isSeeding) {
                    isSeeding = true;
                    document.getElementById('gifts-container').innerHTML = `<div class="col-span-full text-center py-10"><p class="text-brandPrimary font-medium animate-pulse">Ouverture du registre partagé...</p></div>`;
                    
                    const batch = writeBatch(db);
                    baseCadeaux.forEach((c, index) => {
                        const docRef = doc(collection(db, COLLECTION_PATH));
                        batch.set(docRef, { ...c, timestamp: Date.now() - index });
                    });
                    await batch.commit();
                } else {
                    cadeaux = [];
                    snapshot.forEach((doc) => {
                        cadeaux.push({ id: doc.id, ...doc.data() });
                    });
                    cadeaux.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    renderGifts();
                }
            });
        }

        window.setRecipient = function(rec) {
            currentRecipient = rec;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(rec) || (rec === 'Tous' && btn.innerText.includes('Tout'))) {
                    btn.className = "filter-btn active shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-brandPrimary text-white shadow-sm";
                } else {
                    btn.className = "filter-btn shrink-0 px-4 py-2 rounded-lg font-medium text-sm transition-all bg-white text-slate-600 border border-sky-100 hover:bg-sky-50 hover:text-brandPrimary";
                }
            });

            const subFilterContainer = document.getElementById('family-subfilters');
            if(rec === 'Famille') {
                subFilterContainer.classList.remove('hidden');
                subFilterContainer.classList.add('flex');
            } else {
                subFilterContainer.classList.add('hidden');
                subFilterContainer.classList.remove('flex');
                currentSubFilter = 'Tous';
                updateSubFilterButtons();
            }
            renderGifts();
        };

        window.setSubFilter = function(sub) {
            currentSubFilter = sub;
            updateSubFilterButtons();
            renderGifts();
        };

        function updateSubFilterButtons() {
            document.querySelectorAll('.subfilter-btn').forEach(btn => {
                if(btn.innerText === currentSubFilter || (currentSubFilter === 'Tous' && btn.innerText === 'Tous')) {
                    btn.className = "subfilter-btn active shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-brandPrimaryDark text-white";
                } else {
                    btn.className = "subfilter-btn shrink-0 px-3 py-1.5 rounded-md font-medium text-xs transition-all bg-white border border-sky-100 text-slate-600";
                }
            });
        }

        window.setStatus = function(stat) {
            currentStatus = stat;
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.className = "status-btn pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-brandAccent transition-all";
            });
            const activeBtn = document.getElementById(`status-${stat}`);
            activeBtn.className = "status-btn pb-3 text-sm font-semibold border-b-2 border-brandAccent text-brandAccent transition-all";
            renderGifts();
        };

        window.toggleGiftStatus = async function(id) {
            const cadeau = cadeaux.find(c => c.id === id);
            if (cadeau) {
                const newStatut = cadeau.statut === 'Idée' ? 'Acheté' : 'Idée';
                await updateDoc(doc(db, COLLECTION_PATH, id), { statut: newStatut });
            }
        };

        window.deleteGift = async function(id) {
            if(confirm("Retirer cette idée du carnet ?")) {
                await deleteDoc(doc(db, COLLECTION_PATH, id));
            }
        };

        function renderGifts() {
            const container = document.getElementById('gifts-container');
            container.innerHTML = '';

            const filtered = cadeaux.filter(cadeau => {
                const matchRecipient = currentRecipient === 'Tous' || cadeau.destinataire === currentRecipient;
                const matchSub = currentRecipient !== 'Famille' || currentSubFilter === 'Tous' || cadeau.proche === currentSubFilter;
                const matchStatus = currentStatus === 'Tous' || cadeau.statut === currentStatus;
                return matchRecipient && matchSub && matchStatus;
            });

            document.getElementById('gift-counter').innerText = filtered.length + " idées";

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-sky-200">
                        <p class="text-sm font-medium text-slate-500">Aucune idée trouvée pour ces critères.</p>
                    </div>`;
                return;
            }

            filtered.forEach(cadeau => {
                let badgeClass = cadeau.statut === 'Acheté' 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' 
                    : 'bg-orange-50 text-brandAccent border-orange-200 hover:bg-orange-100';
                
                let iconStatut = cadeau.statut === 'Acheté' ? '✓' : '+';
                let textStatut = cadeau.statut === 'Acheté' ? 'Acheté' : 'À trouver';
                
                let destLabel = cadeau.destinataire;
                if (cadeau.destinataire === 'Famille' && cadeau.proche) destLabel += ` • ${cadeau.proche}`;
                if (cadeau.occasion) destLabel += ` • ${cadeau.occasion}`;

                const card = document.createElement('div');
                card.className = "gift-card bg-white rounded-xl p-5 border border-sky-100 relative flex flex-col justify-between shadow-sm";
                
                card.innerHTML = `
                    <button onclick="deleteGift('${cadeau.id}')" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 transition-colors text-lg leading-none" title="Supprimer">✕</button>
                    
                    <div class="pr-6 mb-3">
                        <span class="text-[9px] font-bold uppercase tracking-widest text-brandAccent bg-orange-50 px-2 py-1 rounded mb-2 inline-block">
                            Pour: ${destLabel}
                        </span>
                        <h3 class="text-base font-bold text-slate-900 leading-tight">${cadeau.titre}</h3>
                        ${cadeau.prix ? `<span class="text-sm font-semibold text-brandAccent mt-1 block">${cadeau.prix}</span>` : ''}
                    </div>
                    
                    ${cadeau.note ? `<p class="text-xs text-slate-500 italic mb-4">Note : ${cadeau.note}</p>` : '<div class="mb-4"></div>'}
                    
                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-sky-50">
                        <button onclick="toggleGiftStatus('${cadeau.id}')" class="text-xs font-semibold px-3 py-1.5 rounded-md border transition-colors flex items-center gap-1.5 ${badgeClass}">
                            <span class="text-sm leading-none">${iconStatut}</span> ${textStatut}
                        </button>
                        
                        ${cadeau.lien ? `<a href="${cadeau.lien}" target="_blank" class="text-xs font-semibold text-brandPrimary hover:text-brandPrimaryDark transition-colors flex items-center gap-1">Voir en ligne <span>↗</span></a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.openAddModal = () => document.getElementById('add-modal').showModal();
        window.closeAddModal = () => {
            document.getElementById('add-modal').close();
            document.getElementById('add-form').reset();
            document.getElementById('proche-container').classList.add('hidden');
        };

        window.toggleProcheField = () => {
            const dest = document.getElementById('f-dest').value;
            const procheContainer = document.getElementById('proche-container');
            if(dest === 'Famille') {
                procheContainer.classList.remove('hidden');
            } else {
                procheContainer.classList.add('hidden');
            }
        };

        window.submitNewGift = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Ajout en cours...";
            
            const dest = document.getElementById('f-dest').value;
            
            try {
                await addDoc(collection(db, COLLECTION_PATH), {
                    destinataire: dest,
                    proche: dest === 'Famille' ? document.getElementById('f-proche').value : null,
                    titre: document.getElementById('f-titre').value,
                    prix: document.getElementById('f-prix').value,
                    occasion: document.getElementById('f-occasion').value,
                    statut: document.getElementById('f-statut').value,
                    lien: document.getElementById('f-lien').value,
                    note: document.getElementById('f-note').value,
                    timestamp: Date.now()
                });
                
                closeAddModal();
                setRecipient(dest);
            } catch (error) {
                alert("Erreur lors de l'ajout.");
            } finally {
                btn.innerText = "Enregistrer l'idée";
            }
        };
    </script>
</body>
</html>
